name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build .

  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/checkout@v4
        with:
          repository: eugenioenko/ttt
          ref: 46078783513d0a7eacbddad0f1860c4980296b71
          path: .ttt-integration
      - name: Apply automation API patch
        run: git -C .ttt-integration apply ../compat/ttt-automation.patch
      - name: Build compatible editor
        working-directory: .ttt-integration
        run: go build -race -o bin/ttt ./cmd/ttt
      - name: Test two editors through MCP
        env:
          TTT_BINARY: ${{ github.workspace }}/.ttt-integration/bin/ttt
        run: go test -race ./tests -v -count=1
